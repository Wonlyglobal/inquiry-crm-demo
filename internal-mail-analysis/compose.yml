services:
  sales-email-analysis-worker:
    build: .
    image: wonly-sales-email-analysis-worker:20261009-1
    container_name: wonly-sales-email-analysis-worker
    restart: unless-stopped
    env_file: worker.env
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 700m
    cpus: 0.5
    pids_limit: 64
    networks: [analysis_private]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
  sales-email-model-gateway:
    build: ./model-gateway
    image: wonly-sales-email-model-gateway:20261009-1
    container_name: wonly-sales-email-model-gateway
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 32
    networks: [analysis_private, existing_model_private]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
  sales-email-egress-proxy:
    build: ./egress-proxy
    image: wonly-sales-email-egress-proxy:20261009-1
    container_name: wonly-sales-email-egress-proxy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 32
    networks: [analysis_private, egress]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
networks:
  analysis_private:
    name: wonly-sales-email-analysis-private
    internal: true
  existing_model_private:
    external: true
    name: wonly-video-private
  egress:
    external: true
    name: bridge
