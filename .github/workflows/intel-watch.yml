name: Public intel watch
on:
  schedule:
    - cron: '5 1 * * *'   # 09:05 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: intel-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Read official public sources (headline candidates only)
        run: node scripts/intel-watch.mjs intel-report.md
      - name: Open a review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create --repo "$GITHUB_REPOSITORY" --title "公开情报候选 $(date -u +%F)" --body-file intel-report.md
