<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Grace · 王力 AI</title><link rel="stylesheet" href="assets/grace-orb.css"><link rel="stylesheet" href="assets/grace-public.css"></head><body>
<header><strong>grace<span>·</span></strong><button id="account" aria-label="账号与设置">···</button></header>
<main><section id="welcome"><div class="grace-orb idle" aria-hidden="true"><div class="scene"><div class="ring"></div><div class="body"><div class="face"><i class="eye"></i><i class="eye"></i></div></div></div></div><h1>我在，你说。</h1><p>一起把事情想清楚。</p><a class="enterprise" href="grace.html">企业账号入口</a></section><section id="messages" aria-label="对话记录" aria-live="polite"></section><p id="status" role="status"></p></main>
<form id="composer"><label class="sr-only" for="question">你的问题</label><textarea id="question" rows="1" maxlength="3000" placeholder="问 Grace…" required></textarea><button type="submit" aria-label="发送问题">↑</button></form>
<dialog id="settings"><button class="close" aria-label="关闭">×</button><h2>Grace 账号</h2><p id="identity"></p><button id="logout">退出登录</button><button id="delete-open" class="text-button">删除公众账号</button><a href="grace.html">企业账号入口</a><p>企业资料需使用已有授权账号登录，公众注册不会获得企业权限。</p><a href="grace-privacy.html" target="_blank" rel="noopener">隐私说明</a><a href="grace-support.html" target="_blank" rel="noopener">使用帮助</a></dialog>
<dialog id="auth"><button class="close" aria-label="关闭">×</button><div id="auth-content"></div><button id="auth-toggle" class="text-button">还没有账号？注册</button><a href="grace.html" class="enterprise">使用企业账号</a></dialog>
<dialog id="consent"><h2>开始与 Grace 对话</h2><p>回答由 AI 生成，可能存在错误。你输入的问题和近期对话将发送至阿里云百炼（北京）生成回答。请勿输入企业机密、密码或敏感个人信息。</p><p>当前公众聊天记录仅保存在本次页面会话中。</p><button id="agree">同意并继续</button><button id="decline" class="text-button">暂不使用</button></dialog>
<dialog id="delete-dialog"><button class="close" aria-label="关闭">×</button><form id="delete-form"><h2>删除公众账号</h2><p>这会删除你的 Grace 公众账号和个人额度记录，无法恢复。不会删除或改变企业账号及企业资料。为确认由你本人操作，请输入当前密码。</p><label>当前密码<input name="password" type="password" autocomplete="current-password" maxlength="128" required></label><label><input name="confirmed" type="checkbox" required>我确认永久删除公众账号</label><button type="submit">确认删除</button><p role="status"></p></form></dialog><dialog id="recovery"><form id="recovery-form"><h2>设置新密码</h2><label>新密码<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>再次输入<input name="confirm" type="password" autocomplete="new-password" required></label><button type="submit">保存新密码</button><p role="status"></p></form></dialog><script type="module" src="assets/grace-public-app.mjs"></script></body></html>
