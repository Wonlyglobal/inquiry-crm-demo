name: CRM security checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    name: CRM regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check browser module syntax
        run: node scripts/check-browser-syntax.mjs
      - name: Run offline regression tests
        run: node --test tests/*.test.mjs
      - name: Verify locked mail dependencies
        run: |
          npm install --global pnpm@11.19.0 --ignore-scripts
          pnpm --dir mail-sync install --prod --frozen-lockfile --ignore-scripts
          node --test mail-sync/tests/*.test.mjs
      - name: Build mail service image without starting the service
        run: docker build --tag crm-mail-sync:check mail-sync
      - name: Check whitespace errors
        run: git diff --check HEAD
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan git history without exposing secret values
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts="--all" .'
